<style>
:root{
  --accent:#5294e2;
  --win:#f6f5f4; --win2:#ebe9e7; --tb1:#e8e6e3; --tb2:#d6d3cf; --tbtext:#2e3436;
  --text:#2e3436; --muted:#7d8387; --line:#cdc9c4; --inp:#ffffff;
  --hover:rgba(0,0,0,.06); --sel:rgba(82,148,226,.28); --btn:#fbfaf9; --btn-h:#eeece9; --side:#ecebe9;
  --danger:#e0524f;
}
:root[data-theme="dark"]{
  --win:#383c4a; --win2:#2f343f; --tb1:#3d4252; --tb2:#2f3340; --tbtext:#d3dae3;
  --text:#d3dae3; --muted:#8e95a3; --line:#1f232b; --inp:#2b2e39;
  --hover:rgba(255,255,255,.07); --sel:rgba(82,148,226,.35); --btn:#404552; --btn-h:#4b5163; --side:#2f343f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#10151c;color:var(--text);
  font-family:"Noto Sans",Ubuntu,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:13px;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text;font-family:inherit;font-size:inherit}
button{font-family:inherit;font-size:inherit}

/* Boot */
#boot{position:fixed;inset:0;z-index:99999;background:#14181f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s;color:#cfd8e3}
#boot.off{opacity:0;pointer-events:none}
#boot .logo{font-size:40px;font-weight:300;letter-spacing:2px}
#boot .logo b{font-weight:700;color:#5294e2}
#boot .bar{width:220px;height:4px;background:#262c38;border-radius:4px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:#5294e2;animation:load 1.1s ease forwards}
@keyframes load{to{width:100%}}

/* Painel superior (estilo XFCE) */
#panel{position:fixed;left:0;right:0;top:0;height:30px;z-index:50000;display:flex;align-items:center;gap:4px;padding:0 4px;
  background:linear-gradient(#3a3f46,#2b2f36);color:#e8eaed;border-bottom:1px solid #1b1e23;box-shadow:0 1px 6px rgba(0,0,0,.4)}
#menubtn{height:24px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:#fff;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
#menubtn:hover,#menubtn.open{background:rgba(255,255,255,.14)}
.psep{width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 4px}
#tasks{flex:1;display:flex;gap:3px;overflow:hidden}
.tb{height:24px;max-width:170px;min-width:40px;padding:0 9px;display:flex;align-items:center;gap:6px;border:0;border-radius:4px;
  background:transparent;color:#e8eaed;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb:hover{background:rgba(255,255,255,.12)}
.tb.active{background:rgba(255,255,255,.22)}
.tb.min{opacity:.55}
#tray{height:24px;padding:0 8px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:10px}
#tray:hover{background:rgba(255,255,255,.12)}
#clk{font-variant-numeric:tabular-nums;white-space:pre}

/* Área de trabalho */
#desktop{position:fixed;left:0;right:0;top:30px;bottom:0;overflow:hidden}
#icons{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px;pointer-events:none}
.dicon{pointer-events:auto;width:88px;padding:6px 3px;border-radius:6px;text-align:center;cursor:default;border:1px solid transparent;color:#fff}
.dicon:hover{background:rgba(255,255,255,.12)}
.dicon.sel{background:rgba(82,148,226,.45);border-color:rgba(255,255,255,.35)}
.dicon .i{font-size:34px;line-height:1.1}
.dicon .n{font-size:12px;margin-top:3px;text-shadow:0 1px 3px #000,0 0 2px #000;word-break:break-word}

/* Dock */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;z-index:40000;display:flex;gap:4px;padding:5px 8px;
  background:rgba(25,28,34,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px}
.dk{width:46px;height:46px;font-size:27px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:transform .12s,background .12s}
.dk:hover{transform:translateY(-6px) scale(1.15);background:rgba(255,255,255,.14)}
.dk.run::after{content:"";position:absolute;bottom:0;width:5px;height:5px;border-radius:50%;background:#fff}

/* Janelas */
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);color:var(--text);border:1px solid rgba(0,0,0,.45);
  border-radius:7px 7px 3px 3px;box-shadow:0 12px 36px rgba(0,0,0,.5);overflow:hidden;min-width:300px;min-height:180px}
.win.max{left:0!important;top:0!important;width:100%!important;border-radius:0}
.wbar{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;background:linear-gradient(var(--tb1),var(--tb2));
  border-bottom:1px solid var(--line);color:var(--tbtext);cursor:default;touch-action:none;flex:none}
.wbar .wi{font-size:14px}
.wbar .wt{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:12.5px}
.wb{width:22px;height:20px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--tbtext);cursor:pointer;font-size:13px;line-height:1;padding:0}
.wb:hover{background:var(--hover);border-color:var(--line)}
.wb.x:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 55%,var(--muted) 55%,var(--muted) 62%,transparent 62%,transparent 72%,var(--muted) 72%,var(--muted) 79%,transparent 79%)}
.win.max .rs{display:none}

/* Popups */
.popup{position:fixed;z-index:60000;background:var(--win);border:1px solid var(--line);border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:none;color:var(--text)}
.popup.open{display:block}
#appmenu{left:4px;top:32px;width:290px;padding:8px}
#appmenu .mbox{max-height:min(420px,60vh);overflow:auto;margin:6px 0}
.mfoot{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.mi{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:5px;cursor:pointer}
.mi:hover,.mi.on{background:var(--sel)}
.mi.off{opacity:.4;pointer-events:none}
.mi .i{font-size:18px;width:24px;text-align:center}
.sh{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 9px 3px}
.msep{height:1px;background:var(--line);margin:5px 4px}
#cal{right:4px;top:32px;width:290px;padding:14px}
#cal-time{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
#cal-head{color:var(--muted);text-transform:capitalize;margin-bottom:8px}
.calnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0;text-transform:capitalize;font-weight:600}
.calnav button{border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:4px;width:26px;height:24px;cursor:pointer}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calgrid div{padding:5px 0;border-radius:4px;font-size:12px}
.calgrid .dw{color:var(--muted);font-size:11px}
.calgrid .today{background:var(--accent);color:#fff;font-weight:700}
.calgrid .out{opacity:.3}
.ctx{position:fixed;z-index:80000;min-width:190px;background:var(--win);color:var(--text);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:4px}
#toasts{position:fixed;right:12px;bottom:84px;z-index:95000;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}
.toast{background:rgba(30,32,38,.96);color:#fff;padding:9px 14px;border-radius:8px;margin-top:6px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:360px}

/* Diálogos */
.overlay{position:fixed;inset:0;z-index:90000;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.dlg{width:min(430px,92vw);background:var(--win);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.dlg h3{margin:0 0 8px;font-size:15px}
.dlg p{margin:0 0 10px;color:var(--muted);white-space:pre-wrap;line-height:1.45}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.inp{width:100%;padding:6px 9px;border-radius:5px;border:1px solid var(--line);background:var(--inp);color:var(--text);outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(82,148,226,.3)}
.btn{padding:5px 12px;border-radius:5px;border:1px solid var(--line);background:var(--btn);color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--btn-h)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.on{background:var(--sel);border-color:var(--accent)}

/* Apps em comum */
.toolbar{display:flex;gap:5px;align-items:center;padding:6px;border-bottom:1px solid var(--line);background:var(--win2);flex:none;flex-wrap:wrap}
.status{padding:4px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;flex:none;background:var(--win2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:90px}
.col{display:flex;flex-direction:column;flex:1;min-height:0}

/* Arquivos */
.fm{display:flex;flex:1;min-height:0}
.side{width:165px;flex:none;border-right:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:1px;background:var(--side);overflow:auto}
.side .mi{padding:5px 8px;font-size:12.5px}
.flist{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));grid-auto-rows:min-content;gap:4px;align-content:start;background:var(--inp);outline:none}
.fitem{padding:7px 3px;text-align:center;border-radius:5px;border:1px solid transparent;cursor:default}
.fitem:hover{background:var(--hover)}
.fitem.sel{background:var(--sel);border-color:var(--accent)}
.fitem .fi{font-size:32px}
.fitem .fn{font-size:12px;word-break:break-word;margin-top:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px;line-height:1.6}

/* Bloco de notas / terminal */
.ta{flex:1;width:100%;resize:none;border:0;outline:none;padding:10px;background:var(--inp);color:var(--text);font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;tab-size:4}
.term{flex:1;overflow:auto;background:#1e1f22;padding:8px 10px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;color:#d6e2ff}
.term .o{white-space:pre-wrap;word-break:break-word}
.term .err{color:#ff7b8a}
.term .cmd{color:#fff}
.tline{display:flex}
.tprompt{color:#7ee787;white-space:pre}
.tin{flex:1;background:transparent;border:0;outline:none;color:#fff;font:inherit;padding:0}

/* Navegador */
.bframe{flex:1;width:100%;border:0;background:#fff;display:none}
.bhome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:var(--inp);overflow:auto}
.bhome h1{margin:0;font-weight:300;font-size:30px}
.bhome h1 b{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:min(560px,100%)}
.tile{padding:14px 8px;border:1px solid var(--line);border-radius:8px;text-align:center;cursor:pointer;background:var(--win)}
.tile:hover{background:var(--sel);border-color:var(--accent)}
.tile .i{font-size:28px}

/* Visualizador / mídia */
.vstage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:#22252b;min-height:0}
.vimg{max-width:100%;max-height:100%;object-fit:contain;transition:transform .15s}
.mstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#16181d;color:#e8eaed;padding:12px;min-height:0}
.mstage video{max-width:100%;max-height:100%;flex:1;min-height:0}
.mstage audio{width:min(420px,92%)}

/* Paint */
.ptools{display:flex;gap:5px;align-items:center;padding:6px;border-bottom:1px solid var(--line);background:var(--win2);flex-wrap:wrap}
.pwrap{flex:1;overflow:auto;background:#7d8387;padding:10px;min-height:0}
.pcv{background:#fff;display:block;box-shadow:0 2px 10px rgba(0,0,0,.4);touch-action:none;cursor:crosshair;max-width:none}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--inp)}

/* Relógio / monitor / config */
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--win2)}
.tabs button{flex:1;padding:8px;border:0;background:transparent;color:var(--text);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{border-bottom-color:var(--accent);font-weight:700}
.pane{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;overflow:auto}
.big{font-size:48px;font-weight:300;font-variant-numeric:tabular-nums}
.mon{flex:1;overflow:auto;padding:8px}
.mon table{width:100%;border-collapse:collapse}
.mon td,.mon th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.mstats{padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 16px;border-top:1px solid var(--line);background:var(--win2);font-size:12px}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 8px;font-size:13px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.swatch.on{border-color:var(--text)}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.wall{height:50px;border-radius:6px;cursor:pointer;border:3px solid transparent}
.wall.on{border-color:var(--accent)}

/* Jogos / calculadora */
.gwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;background:var(--win);outline:none;overflow:auto;min-height:0}
.scv{background:#12161c;border-radius:6px;max-width:100%}
.dpad{display:grid;grid-template-columns:repeat(3,44px);gap:4px}
.dpad button{height:36px;border:1px solid var(--line);border-radius:6px;background:var(--btn);color:var(--text);cursor:pointer;font-size:16px}
.mg{display:grid;gap:2px;justify-content:center}
.mc{width:27px;height:27px;border:1px solid var(--line);border-radius:3px;background:var(--btn);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;font-size:14px}
.mc.o{background:var(--win2);cursor:default}
.calc{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;outline:none}
.cdisp{background:var(--inp);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:right;font-size:26px;font-variant-numeric:tabular-nums;min-height:64px;word-break:break-all;display:flex;flex-direction:column;justify-content:flex-end}
.cdisp small{color:var(--muted);font-size:13px;min-height:16px}
.ckeys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ckeys button{border:1px solid var(--line);border-radius:6px;background:var(--btn);color:var(--text);font-size:18px;cursor:pointer;min-height:42px}
.ckeys button:hover{background:var(--btn-h)}
.ckeys button.op{background:var(--win2)}
.ckeys button.eq{background:var(--accent);color:#fff;border-color:var(--accent)}
.ckeys button.cl{background:#f1c9c8;color:#7a1f1d}

/* ===== WebOS 3.0: ícones, painel, dock, novos apps ===== */
html{--dockh:66px;--ics:40px;--fs:13px}
html[data-dock="auto"],html[data-dock="off"]{--dockh:0px}
body{font-size:var(--fs)}
.ic{display:block;flex:none}
.icw{display:inline-flex;align-items:center;justify-content:center;flex:none}
.aic{display:inline-flex;align-items:center;justify-content:center;border-radius:24%;color:#fff;flex:none;
  background-image:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,0) 60%);box-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.28)}
.aic.light{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.win.max{height:calc(100% - var(--dockh))!important}
html.noanim *{transition:none!important;animation:none!important}

#panel{height:30px}
#menubtn{gap:7px}
#menubtn .ic{opacity:.95}
#volbtn,.pbtn{height:24px;width:28px;border:0;border-radius:4px;background:transparent;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#volbtn:hover,#volbtn.open,.pbtn:hover{background:rgba(255,255,255,.14)}
#net{display:flex;align-items:center}
html[data-panel="accent"] #panel{background:var(--accent);border-bottom-color:rgba(0,0,0,.25)}
html[data-panel="light"] #panel{background:linear-gradient(#f4f3f1,#e3e1de);color:#2e3436;border-bottom-color:#bdb9b4}
html[data-panel="light"] .tb,html[data-panel="light"] #menubtn{color:#2e3436}
html[data-panel="light"] .tb:hover,html[data-panel="light"] #menubtn:hover,html[data-panel="light"] #tray:hover,html[data-panel="light"] #volbtn:hover,html[data-panel="light"] .pbtn:hover{background:rgba(0,0,0,.08)}
html[data-panel="light"] .tb.active{background:rgba(0,0,0,.14)}
html[data-panel="light"] .psep{background:rgba(0,0,0,.2)}
.tb .tt{overflow:hidden;text-overflow:ellipsis}
.tb{gap:7px}
.wbar .wi{display:inline-flex}
.wb{display:flex;align-items:center;justify-content:center}
#volpop{top:32px;width:240px;padding:14px}
#volpop .vrow{display:flex;align-items:center;gap:10px}
#volpop input[type=range]{flex:1}
#volpop small{color:var(--muted);display:block;margin-top:10px;line-height:1.4}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}

#dock{padding:6px 9px;gap:6px;border-radius:16px}
.dk{width:52px;height:52px}
.dk.run::after{bottom:-1px}
#dockzone{position:fixed;left:0;right:0;bottom:0;height:8px;z-index:39999;display:none}
html[data-dock="auto"] #dockzone{display:block}
html[data-dock="off"] #dock{display:none}
html[data-dock="smart"].hasmax{--dockh:0px}
html[data-dock="smart"].hasmax #dockzone{display:block}
html[data-dock="smart"].hasmax #dock{transform:translate(-50%,calc(100% + 16px));transition:transform .2s}
html[data-dock="smart"].hasmax #dock.show{transform:translate(-50%,0)}
html[data-dock="auto"] #dock{transform:translate(-50%,calc(100% + 16px));transition:transform .2s}
html[data-dock="auto"] #dock.show{transform:translate(-50%,0)}

.dicon{width:calc(var(--ics) + 50px);padding:7px 3px;display:flex;flex-direction:column;align-items:center;gap:5px}
.dicon .n{margin-top:0;font-size:12px}
.side .mi .icw{color:var(--muted)}
.side .mi.on .icw{color:var(--accent)}
.fitem .fi{display:flex;justify-content:center;margin-bottom:3px}
.btn.ib{display:inline-flex;align-items:center;gap:5px}
.btn.ib .icw{opacity:.85}
.mi .icw{flex:none}

/* diálogo de arquivos */
.dlg.wide{width:min(600px,94vw)}
.fdlist{height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--inp);margin:8px 0}
.fdrow{display:flex;align-items:center;gap:9px;padding:5px 9px;cursor:default}
.fdrow:hover{background:var(--hover)}
.fdrow.sel{background:var(--sel)}
.fdtop{display:flex;gap:5px;align-items:center}

/* navegador */
.btabs{display:flex;align-items:flex-end;gap:2px;padding:5px 5px 0;background:var(--win2);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.btab{display:flex;align-items:center;gap:6px;width:170px;min-width:90px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;background:var(--tb2);color:var(--text);cursor:default;flex:none}
.btab.on{background:var(--win);font-weight:600}
.btab span.t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btab .cl{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:.65}
.btab .cl:hover{background:var(--hover);opacity:1}
.btabs .plus{width:26px;height:26px;margin-bottom:3px;border:0;border-radius:5px;background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.btabs .plus:hover{background:var(--hover)}
.bviews{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.bpage{flex:1;min-height:0;flex-direction:column;display:flex;position:relative}
webview.bframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
.bwarn{display:none;flex:none;align-items:center;gap:10px;padding:5px 10px;background:#fef3c7;color:#78350f;font-size:12px;border-bottom:1px solid #fcd34d}
.bwarn span{flex:1}
.hed{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0}
.hed.v{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.hed .ta{border-right:1px solid var(--line)}
.hed iframe{width:100%;height:100%;border:0;background:#fff}
.bframe{flex:1;width:100%;border:0;background:#fff;display:none}
.bhome{flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 20px;background:var(--inp);overflow:auto}
.bhome h1{margin:0;font-weight:300;font-size:30px}
.bhome h1 b{color:var(--accent)}
.bhome .note{color:var(--muted);max-width:520px;text-align:center;line-height:1.5;font-size:12px}
.bhome .lst{width:min(640px,100%);display:flex;flex-direction:column;gap:2px}
.bhome .lrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:default}
.bhome .lrow:hover{background:var(--hover)}
.bhome .lrow .u{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.bmbar{display:flex;gap:4px;padding:3px 6px;border-bottom:1px solid var(--line);background:var(--win2);overflow:hidden;flex:none}
.bmbar:empty{display:none}
.bmbar .btn{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tile{padding:14px 8px;border:1px solid var(--line);border-radius:10px;text-align:center;cursor:pointer;background:var(--win);display:flex;flex-direction:column;align-items:center;gap:7px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:min(620px,100%)}

/* editor de fotos */
.phstage{flex:1;overflow:auto;display:flex;background:#22252b;min-width:0;min-height:0}
.phwrap{position:relative;margin:auto;line-height:0;touch-action:none}
.phcv{display:block;cursor:crosshair}
.phcrop{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);pointer-events:none}
.phside{width:230px;flex:none;border-left:1px solid var(--line);padding:10px;overflow:auto;background:var(--win2)}
.phside h5,.spane h5{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.phside h5:first-child{margin-top:0}
.phrow{margin-bottom:7px;font-size:12px}
.phrow label{display:flex;justify-content:space-between}
.phrow input[type=range]{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px}

/* tarefas / gravador */
.todo{flex:1;overflow:auto;padding:6px 10px}
.trow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.trow.done span{text-decoration:line-through;color:var(--muted)}
.trow span{flex:1;word-break:break-word}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.recbtn{width:64px;height:64px;border-radius:50%;border:0;background:#e11d48;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.recbtn.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(225,29,72,.25)}}
.g2{display:grid;grid-template-columns:repeat(4,70px);gap:6px;padding:8px;background:var(--win2);border-radius:8px}
.g2 div{width:70px;height:70px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;background:rgba(127,127,127,.18)}

/* monitor */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;padding:10px;overflow:auto;align-content:start;flex:1}
.mcard{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--win)}
.mcard h5{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between}
.mcard .v{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}
canvas.spark{width:100%;height:64px;display:block;margin-top:6px}
.bar{height:8px;border-radius:5px;background:var(--win2);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv b{color:var(--muted);font-weight:600}
.kv span{word-break:break-word}

/* configurações */
.spane{flex:1;overflow:auto;padding:6px 18px 18px}
.spane h3{margin:14px 0 4px;font-size:16px;font-weight:600}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 2px;border-bottom:1px solid var(--line)}
.srow small{display:block;color:var(--muted);margin-top:2px;line-height:1.35}
.srow .ctl{display:flex;gap:6px;align-items:center;flex:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--sel)}

/* ===== Interface estilo Windows: barra de tarefas embaixo ===== */
html[data-ui="win"]{--dockh:0px}
html[data-ui="win"] #panel{top:auto;bottom:0;height:48px;padding:0 8px;gap:6px;border-bottom:0;border-top:1px solid rgba(255,255,255,.14);background:rgba(22,26,38,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

   App: Terminal

  const short = () => cwd === HOME ? '~' : cwd.startsWith(HOME + '/') ? '~' + cwd.slice(HOME.length) : cwd;
  const setPrompt = () => { pr.textContent = CUR.id + '@bos:' + short() + '$ '; };

  const abs = p => resolvePath(p, cwd);

  help                 mostra esta ajuda
  ls [-la] [pasta]     lista arquivos (-a mostra ocultos, -l detalhes)
  cd [pasta]           muda de pasta        pwd   pasta atual
  mkdir [-p] nome      cria pasta           touch arquivo   cria arquivo
  cat arquivo          mostra o conteúdo
  echo texto           escreve texto (use > ou >> para gravar em arquivo)
  rm [-r] alvo         remove               mv origem destino   move/renomeia
  cp [-r] orig dest    copia                tree [pasta]   árvore de pastas
  open arquivo|pasta   abre no aplicativo certo
  run app              abre um aplicativo (veja "apps")
  apps                 lista os aplicativos
  date  uptime  df  whoami  hostname  uname  neofetch  history  clear  exit`;

    help: () => HELP, pwd: () => cwd, whoami: () => CUR.id, hostname: () => 'bos', uname: () => 'BOS 3.0',
    date: () => new Date().toLocaleString('pt-BR', { dateStyle: 'full', timeStyle: 'medium' }),

    df: async () => { let u = ''; try { const e = await navigator.storage.estimate(); u = `\nNavegador: usando ${fmtSize(e.usage)} de ${fmtSize(e.quota)}`; } catch (e) {} return 'Armazenamento do WebOS: ' + (Store.mode === 'disk' ? (SHELL ? Store.name : 'pasta "' + Store.name + '/WebOS-Dados" do computador') : 'navegador') + u; },
    clear: () => { out.innerHTML = ''; return ''; }, exit: () => { W.close(true); return ''; },

    apps: () => Object.values(APPS).map(a => `${a.id.padEnd(10)} ${a.name}`).join('\n'),

    neofetch: () => `   __        __   _     ___  ____

    \\ \\ /\\ / / _ \\ '_ \\ | | \\___ \\     SO: WebOS 3.0
     \\ V  V /  __/ |_) | |_| |___) |    Shell: websh
      \\_/\\_/ \\___|_.__/ \\___/|____/     Resolução: ${innerWidth}x${innerHeight}`,
    cd: async a => { const p = abs(a[0] || '~'), s = await need(p, a[0], 'cd'); if (!s.dir) throw Error(`cd: ${a[0]}: Não é um diretório`); cwd = p; setPrompt(); return ''; },

    cp: async a => {
      const rec = a.includes('-r'), t = a.filter(x => x !== '-r'); if (t.length !== 2) throw Error('uso: cp [-r] origem destino');
      const s = abs(t[0]), st = await need(s, t[0], 'cp'); if (st.dir && !rec) throw Error(`cp: '${t[0]}' é um diretório (use -r)`);
      const d = await destOf(s, abs(t[1])); await copyTree('vfs', s, 'vfs', d); return '';
    },
    tree: async a => { const p = abs(a[0] || '.'), s = await need(p, a[0], 'tree'); return (p === '/' ? '/' : base(p)) + '\n' + (s.dir ? await tree(p) : ''); },
    open: async a => { if (!a[0]) throw Error('open: operando ausente'); const p = abs(a[0]), s = await need(p, a[0], 'open'); if (s.dir) launch('files', { path: p }); else openPath('vfs', p); return ''; },
  };
  commands.nano = commands.edit = commands.notepad = a => { launch('notepad', a[0] ? { src: 'vfs', path: abs(a[0]) } : {}); return ''; };

  const tokenize = line => { const toks = [], re = /"([^"]*)"|'([^']*)'|(\S+)/g; let m; while ((m = re.exec(line))) toks.push(m[1] ?? m[2] ?? m[3]); return toks; };

/* Tela de escolha da pasta do WebOS (primeiro uso) e de reconexão (cada vez que o navegador é reaberto) */
function gateCard(title, text, buttons) {
  return new Promise(res => {
    const done = v => { ov.remove(); res(v); };
    const ov = el('div', { class: 'overlay', style: 'z-index:100000;background:rgba(10,14,22,.85)' },
      el('div', { class: 'dlg wide' }, el('h3', {}, title), el('p', {}, text), el('div', { class: 'row', style: 'flex-wrap:wrap' }, buttons.map(([label, cls, fn]) => el('button', { class: 'btn ' + cls, onclick: async () => { try { const r = await fn(); if (r !== 'stay') done(r); } catch (e) { if (e && e.name !== 'AbortError') toast('Erro: ' + e.message); } } }, label)))));
    document.body.append(ov);
  });
}
async function useFolder(h) {
  const old = MemFS, hadMem = MemFS.hasData();
  await connectDisk(h); await IDB.set('syshandle', h); await IDB.del('diskdeclined');
  if (hadMem) { try { await mergeTree(old, '/', Prov.disk, '/'); toast('Seus arquivos do navegador foram copiados para a pasta'); } catch (e) { toast('Erro ao copiar: ' + e.message); } }
}
async function initStorage() {
  await IDB.open(); loadLocalSettings(); applySettings(); await MemFS.load(); await loadMounts();
  if (SHELL) { Store.mode = 'disk'; Store.shell = true; Store.name = await SHELL.dataDir(); await prepareDisk(); await loadSettingsFull(); applySettings(); return; }
  const h = await IDB.get('syshandle');
  if (h && Real.supported()) {
    let perm = 'prompt'; try { perm = h.queryPermission ? await h.queryPermission({ mode: 'readwrite' }) : 'granted'; } catch (e) {}
    let ok = false;
    if (perm === 'granted') { try { await connectDisk(h); ok = true; } catch (e) {} }
    if (!ok) {
      await gateCard('Liberar a pasta do WebOS', `Seus arquivos estão salvos na pasta "${h.name}" do computador. Por segurança, o navegador pede para você liberar o acesso a cada vez que é aberto.`, [
        ['Liberar acesso', 'pri', async () => { if (h.requestPermission && (await h.requestPermission({ mode: 'readwrite' })) !== 'granted') { toast('Permissão negada'); return 'stay'; } await connectDisk(h); return true; }],

        ['Usar o navegador por agora', '', async () => false]]);
    }

  await loadSettingsFull(); applySettings();
}
